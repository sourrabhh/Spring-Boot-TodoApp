---
apiVersion: v1
kind: ReplicationController
metadata: 
  name: sbtodorc 
spec:
  replicas: 3
  selector:
    app: sbtodoapp  # label name 
  template:
    metadata:
      name: sbtodoapppod
      labels:
        app: sbtodoapp
    spec:
      containers:
        - name: sbtodoappcontainer
          image: sourabh2411/sbtodoapp
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: sbtodoappsvc
spec:
  type: NodePort
  selector:
    app: sbtodoapp
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30785
...