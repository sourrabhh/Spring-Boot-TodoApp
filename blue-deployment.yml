---
apiVersion: apps/v1
kind: Deployment
metadata: 
  name: sbtodobluedeployment
spec: 
  replicas: 2
  strategy: 
    type: RollingUpdate
  selector: 
    matchLabels: 
      version: v1 
      color: blue
  template:
    metadata: 
      name: sbtodoapppod 
      labels:
        version: v1 
        color: blue
    spec: 
      containers:
        - name: sbtodoappcontainer
          image: sourabh2411/sbtodoapp
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
...